<!DOCTYPE html>
<html lang="ru">
<head>
  <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Иван Молчанов — Саунд-дизайн</title>
  <style>
    /* ===== RESET & BASE ===== */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      font-family: 'Inter', system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #0a0f1a;
      background-image: radial-gradient(ellipse at 20% 30%, #0f2847, #050a14);
      color: #eef2f7;
      line-height: 1.6;
      min-height: 100vh;
      padding: 0 20px 40px;
    }

    /* ===== КОНТЕЙНЕР ===== */
    .container {
      max-width: 1400px;
      margin: 0 auto;
    }

    /* ===== HEADER ===== */
    header {
      text-align: center;
      padding: 3rem 1rem 2rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      margin-bottom: 2rem;
    }

    .logo-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .sound-wave-logo {
      width: 80px;
      height: 80px;
      fill: none;
      stroke: #f89202;
      stroke-width: 5;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: drop-shadow(0 0 20px rgba(248, 146, 2, 0.4));
      transition: all 0.3s ease;
      margin-bottom: 1.2rem;
    }
    .sound-wave-logo:hover {
      transform: scale(1.1) rotate(-2deg);
      filter: drop-shadow(0 0 35px rgba(255, 180, 40, 0.8));
    }

    h1 {
      font-size: clamp(2.6rem, 6vw, 4rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #ffffff 30%, #b0cfff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1.1;
      margin-bottom: 0.3rem;
    }

    .subtitle {
      font-size: clamp(1rem, 1.6vw, 1.3rem);
      font-weight: 400;
      color: #b6c8e6;
      letter-spacing: 0.02em;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 0.8rem;
      display: inline-block;
      margin-bottom: 0.5rem;
    }

    .contacts-row {
      font-size: 0.95rem;
      color: #a0b8d9;
      margin-top: 0.5rem;
    }
    .contacts-row a {
      color: #f89202;
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s, text-shadow 0.2s;
    }
    .contacts-row a:hover {
      color: #ffb84d;
      text-shadow: 0 0 12px rgba(248, 146, 2, 0.3);
    }

    /* ===== НАВИГАЦИЯ (кнопки-якоря + табы) ===== */
    .nav-block {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px 16px;
      margin: 1.8rem 0 0.5rem;
    }

    .nav-btn {
      display: inline-block;
      padding: 10px 24px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 60px;
      color: #c8d8f0;
      font-weight: 600;
      font-size: 0.9rem;
      text-decoration: none;
      transition: all 0.25s ease;
      backdrop-filter: blur(6px);
      cursor: pointer;
      background: rgba(10, 20, 40, 0.5);
    }
    .nav-btn:hover {
      background: rgba(248, 146, 2, 0.15);
      border-color: #f89202;
      color: #fff;
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(248, 146, 2, 0.15);
    }
    .nav-btn.active {
      background: #f89202;
      border-color: #f89202;
      color: #0a0f1a;
      box-shadow: 0 8px 30px rgba(248, 146, 2, 0.35);
    }

    /* ===== КАТЕГОРИИ (спейсеры) теперь скрыты, но оставлены для якорей ===== */
    .section-anchor {
      scroll-margin-top: 100px;
    }

    /* ===== СЕТКА ПОРТФОЛИО ===== */
    .portfolio-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 2rem;
      margin-top: 2rem;
    }

    /* ===== КАРТОЧКА ===== */
    .case-card {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 24px;
      padding: 1.5rem 1.5rem 1.8rem;
      display: flex;
      flex-direction: column;
      transition: all 0.3s cubic-bezier(0.2, 0.9, 0.4, 1);
      box-shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.6);
      height: 100%;
    }
    .case-card:hover {
      transform: translateY(-6px);
      border-color: rgba(248, 146, 2, 0.4);
      box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.8), 0 0 30px rgba(248, 146, 2, 0.05);
    }

    .case-card h3 {
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      color: #ffffff;
      margin-bottom: 0.4rem;
      position: relative;
      padding-bottom: 0.6rem;
    }
    .case-card h3::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 40px;
      height: 2px;
      background: #f89202;
      box-shadow: 0 0 12px rgba(248, 146, 2, 0.6);
    }

    .case-card p {
      color: #b6c8e6;
      font-size: 0.95rem;
      margin: 0.8rem 0 1.5rem;
      flex-grow: 1;
      line-height: 1.5;
    }

    .case-card .video-wrapper {
      position: relative;
      padding-top: 56.25%; /* 16:9 */
      width: 100%;
      border-radius: 14px;
      overflow: hidden;
      background: #000;
      flex-shrink: 0;
    }
    .case-card .video-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }

    /* ===== ВКЛАДКИ (отображение) ===== */
    .tab-content {
      display: none;
    }
    .tab-content.active {
      display: block;
    }

    /* ===== FOOTER ===== */
    footer {
      margin-top: 4rem;
      padding: 2.5rem 1rem 1rem;
      text-align: center;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      color: #7a8fa8;
      font-size: 0.9rem;
    }
    footer .contacts-row {
      margin-bottom: 0.8rem;
    }
    footer a {
      color: #f89202;
      text-decoration: none;
      font-weight: 500;
    }
    footer a:hover {
      color: #ffb84d;
    }

    /* ===== АНИМАЦИИ ===== */
    .fade-in {
      animation: fadeUp 0.6s ease forwards;
      opacity: 0;
    }
    @keyframes fadeUp {
      0% { opacity: 0; transform: translateY(24px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    /* ===== АДАПТИВ ===== */
    @media (max-width: 700px) {
      body { padding: 0 12px 30px; }
      .portfolio-grid { grid-template-columns: 1fr; gap: 1.8rem; }
      .nav-block { gap: 8px; }
      .nav-btn { padding: 8px 16px; font-size: 0.8rem; }
      .case-card { padding: 1.2rem; }
    }
    @media (min-width: 701px) and (max-width: 1100px) {
      .portfolio-grid { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>

<script>
  (function() {

    const casesData = [

        iframe: 'https://kinescope.io/embed/ed9A5Es1YVEXjmzvJid66M'
      },
      // 4. Редизайн звука (tab-redesign)

        iframe: 'https://kinescope.io/embed/6vnLyXzK5zJm5bKzJbJYWL'
      },
      {
        category: 'instruments',
        title: 'Озвучка: барабанная установка',

        iframe: 'https://kinescope.io/embed/iFmKE25MxwBE1FyBPj9sJP'

        iframe: 'https://kinescope.io/embed/hQTLCUExqZ2gumRs3JUkuB'
      },
      // 10. Саунд-дизайн видео контента (tab-video)
      {
        category: 'video',
        title: 'Саунд-дизайн: водопад',
        desc: 'Задача: записать и обработать звук водопада для медитативного ролика. Нужно было передать мощь и спокойствие одновременно. Использовал: полевые записи, обработку для выделения разных слоёв (брызги, поток, эхо), панорамирование для создания эффекта присутствия.',

        iframe: 'https://kinescope.io/embed/2WxZ1B3paFEdvpLazZiq8d'
      },
      {
        category: 'video',
        title: 'Саунд-дизайн: рыцарское сражение',

        iframe: 'https://kinescope.io/embed/7pZAydiu9KnweeWz9N9t7k'
      },
      {
        category: 'video',
        title: 'Саунд-дизайн: стадион',

        iframe: 'https://kinescope.io/embed/mKbvbHB692wMkBFbQd933p'

        iframe: 'https://kinescope.io/embed/w4EQza4f6hDQo3nYaTkK64'
      },
      {
        category: 'video',
        title: 'Саунд-дизайн: Имитация сцены пожара',
        desc: 'Задача: создать реалистичную звуковую картину пожара. Нужно было передать нарастание интенсивности и объём пространства. Использовал: использовал звуковыке слои огня и треска, обработку реверберацией и панорамированием для эффекта присутствия.',
        iframe: 'https://kinescope.io/embed/8xyaCAkhpgBxn86y9qLiqW'
      },
      {
        category: 'video',
        title: 'Саунд-дизайн: летящий дракон',
        desc: 'Задача: создать звук полёта и рёва дракона для фэнтезийного ролика. Нужно было сделать звук мощным, но не перегруженным. Использовал: наложение слоёв (ветер, крылья, рык), обработку для создания объёма, панорамирование для эффекта пролёта перед зрителем.',
        iframe: 'https://kinescope.io/embed/ti6QvRaC6UfMFtjz1znHKV'
      }
    ];

    // ----- Рендеринг сеток -----
    function renderGrid(containerId, items) {
      const container = document.getElementById(containerId);
      if (!container) return;
      let html = '';
      items.forEach(item => {
        html += `
          <article class="case-card fade-in">
            <h3>${item.title}</h3>
            <p>${item.desc}</p>
            <div class="video-wrapper">
              <iframe src="${item.iframe}" allow="autoplay; fullscreen; picture-in-picture; encrypted-media; gyroscope; accelerometer; clipboard-write; screen-wake-lock;" allowfullscreen></iframe>
            </div>
          </article>
        `;
      });
      container.innerHTML = html;
    }

    // Группировка по категориям
    const allItems = casesData;
    const voiceItems = casesData.filter(c => c.category === 'voice');
    const redesignItems = casesData.filter(c => c.category === 'redesign');
    const instrumentsItems = casesData.filter(c => c.category === 'instruments');
    const videoItems = casesData.filter(c => c.category === 'video');

    renderGrid('grid-all', allItems);
    renderGrid('grid-voice', voiceItems);
    renderGrid('grid-redesign', redesignItems);
    renderGrid('grid-instruments', instrumentsItems);
    renderGrid('grid-video', videoItems);

    // ----- Переключение табов -----
    const tabs = document.querySelectorAll('.nav-btn');
    const contents = {
      'tab-all': document.getElementById('tab-all'),
      'tab-voice': document.getElementById('tab-voice'),
      'tab-redesign': document.getElementById('tab-redesign'),
      'tab-instruments': document.getElementById('tab-instruments'),
      'tab-video': document.getElementById('tab-video')
    };

    function activateTab(tabId) {
      // Скрыть все контенты
      Object.values(contents).forEach(el => el.classList.remove('active'));
      // Показать нужный
      if (contents[tabId]) contents[tabId].classList.add('active');
      // Обновить кнопки
      tabs.forEach(btn => {
        btn.classList.remove('active');
        if (btn.dataset.tab === tabId) btn.classList.add('active');
      });
    }

    tabs.forEach(btn => {
      btn.addEventListener('click', function(e) {
        const tabId = this.dataset.tab;
        if (tabId) activateTab(tabId);
      });
    });

    // ----- Поддержка якорей (при переходе по ссылке с #sec-...) -----
    // При загрузке проверяем хеш и активируем соответствующую вкладку
    function handleHash() {
      const hash = window.location.hash.replace('#', '');
      if (!hash) return;
      // Маппинг якорей на табы
      const map = {
        'sec-voice': 'tab-voice',
        'sec-redesign': 'tab-redesign',
        'sec-instruments': 'tab-instruments',
        'sec-video': 'tab-video'
      };
      const tabId = map[hash];
      if (tabId && contents[tabId]) {
        activateTab(tabId);
        // Прокрутим к началу секции (чтобы не терять контекст)
        setTimeout(() => {
          const target = document.getElementById(hash);
          if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }, 100);
      }
    }

    window.addEventListener('hashchange', handleHash);
    // При загрузке тоже обработаем
    document.addEventListener('DOMContentLoaded', handleHash);

    // Дополнительно: если клик по якорю внутри сайта (например, из хедера) - обработаем
    document.querySelectorAll('a[href^="#sec-"]').forEach(link => {
      link.addEventListener('click', function(e) {
        const href = this.getAttribute('href');
        if (href) {
          const hash = href.replace('#', '');
          const map = {
            'sec-voice': 'tab-voice',
            'sec-redesign': 'tab-redesign',
            'sec-instruments': 'tab-instruments',
            'sec-video': 'tab-video'
          };
          const tabId = map[hash];
          if (tabId && contents[tabId]) {
            e.preventDefault();
            activateTab(tabId);
            // Прокрутим к якорю
            const target = document.getElementById(hash);
            if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
          }
        }
      });
    });

  })();
</script>
</body>
</html>
